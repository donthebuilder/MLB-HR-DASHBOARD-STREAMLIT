name: MLB HR Bot — Grade Results (data branch only)

on:
  schedule:
    # Phoenix is UTC-7 year-round.
    #
    # This used to be "0 2,4,6,8,10 * * *" -- 7pm, 9pm, 11pm, 1am and 3am
    # Phoenix. Every one of those is at or after the point most games have
    # ENDED, so the Results tab sat on a grade from the middle of the night
    # and showed 120 PENDING picks with 0 HRs all afternoon, right through
    # first pitch and the whole early slate. Nothing was broken; grading
    # simply never ran while the games were on.
    #
    # Now it runs hourly from 11am Phoenix (18:00 UTC) -- ahead of the
    # earliest first pitch -- through 3am Phoenix, covering every game from
    # the day slate to a West-coast extra-innings finish. Each run is ~40s.
    # Phoenix 9am-11pm hourly, plus 1am and 3am for the final sweep. Grading
    # now starts before first pitch so early games are picked up as they go,
    # not two hours after they end.
    # 07:00 UTC ADDED 2026-08-11 (Donovan: "make sure the result run to when
    # the day switches over so the site updates too"). The list above ran
    # hourly 16:00 -> 06:00 UTC and then jumped to 08:00, so 07:00 was the
    # single hole in an otherwise continuous block — and 07:00 UTC is midnight
    # Phoenix exactly. That is the moment the local date rolls, so the one hour
    # with no grading run was the one hour the site needed a fresh publish to
    # carry the finished night across the switch. A West-coast game ending
    # 11:40pm was graded at 06:00, then nothing published again until 08:00,
    # an hour after the day had already turned over.
    # HOURLY, AT :10 PAST (2026-08-14, Donovan: "once the bot runs for the new
    # slate the results should run right after it, so like at least 40 minutes
    # after the first today is ran... and also add more results runs through
    # the slate, I'm tired of manually running it").
    #
    # One line does both jobs. The old list ran 16:00->10:00 and then stopped,
    # leaving 09:00 and 11:00-15:00 UTC with no grading at all -- a six-hour
    # hole starting half an hour after the day rolled over, which is exactly
    # the window he was hand-running it in.
    #
    # :10 rather than :00 for two reasons. today.yml's day rollover is at
    # 10:30 UTC, so 11:10 lands 40 minutes after it, as asked. And every other
    # today.yml build fires on the hour, so grading at :10 reads a slate that
    # has finished publishing instead of racing it.
    - cron: "10 * * * *"
  workflow_dispatch: {}

# One group PER WORKFLOW, not one shared across all of them.
# GitHub keeps at most a single *pending* run per concurrency group, so a
# shared group meant each newly queued run cancelled the previously queued
# one -- that's what silently killed the Tomorrow slate and the Grade Results
# run. Publishing races are handled in publish_data.sh instead, which
# re-reads the data branch immediately before it force-pushes.
concurrency:
  group: mlb-results
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  grade-results:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r bots/requirements.txt

      # Same corrected cache path as the picks workflow -- bots/cache.db
      # never existed, so this cache was doing nothing.
      - name: Restore SQLite cache
        uses: actions/cache@v4
        with:
          path: bots/mlb_hr_cache.sqlite
          key: sqlite-cache-${{ github.run_id }}
          restore-keys: |
            sqlite-cache-

      # The grader reads its picks from bots/outputs/, which is empty in a
      # fresh CI checkout. This pulls the published slate off the data branch
      # and writes it where the grader looks.
      - name: Fetch published picks
        run: python bots/fetch_picks_for_grading.py --date today

      # SUSPENDED-GAME FIX (2026-08-21, Sol's audit finding #4). See
      # regrade_stale_dates()'s docstring in live_results_tracker.py: a game
      # suspended on day D and resumed on D+2 used to sit un-regraded forever,
      # because nothing ever revisited a date once tomorrow's slate existed.
      # That recheck can only see outcome logs THIS runner has locally, and a
      # fresh checkout starts empty -- so restore the recent ones from the
      # data branch first. outcome_log_*.jsonl already accumulates there
      # (OUTCOME_LOG_KEEP=150 dates, publish_data.sh), so this is the same
      # git-archive-and-copy the "Restore graded history" step below already
      # does for the backtest report's different files, just earlier and
      # narrower. Deliberately does NOT restore breakdown files -- the recheck
      # reconstructs its minimal rows straight from the outcome log itself
      # (player_id + game_pk), which the breakdown file was never needed for.
      - name: Restore recent outcome logs for the stale-game recheck
        run: |
          git fetch origin data --depth 1 2>/dev/null || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            rm -rf /tmp/outcome-restore && mkdir -p /tmp/outcome-restore
            git archive origin/data public/data 2>/dev/null | tar -x -C /tmp/outcome-restore || true
            cp /tmp/outcome-restore/public/data/current/outcome_log_*.jsonl bots/outputs/ 2>/dev/null || true
            echo "Restored $(ls bots/outputs/outcome_log_*.jsonl 2>/dev/null | wc -l) outcome log file(s)."
          fi
        continue-on-error: true

      # SILENT-RESET GUARD (2026-08-21, Sol audit #2 finding #5), REVISED
      # (2026-08-21, quick review of the first version of this fix). The
      # restore step above is deliberately best-effort (continue-on-error:
      # true, every risky command already ending in `|| true`) -- an infra
      # hiccup (git fetch flaking, origin/data briefly unreachable) shouldn't
      # fail the whole grading run. But bots/outputs/ is also the
      # `existing_path` that TODAY's own write_outcome_log() call reads a few
      # steps below, to tell "nothing changed" from "this needs a new
      # revision." If the data branch already has TODAY's own
      # outcome_log_<date>.jsonl (meaning an earlier run today already
      # published some revisions) but it didn't land locally, write_outcome_log()
      # would see no prior history at all, treat every candidate as
      # revision=1, and -- because it always stages a file for today's date --
      # permanently overwrite the true accumulated revision/supersedes history
      # when publish_data.sh's carry_forward() runs. That's strictly worse
      # than just skipping today's grading.
      #
      # The first version of this guard only checked whether a *local* copy
      # existed at the path the best-effort restore step above would have
      # written to -- but if that step's own `git fetch origin data --depth 1`
      # failed (the exact "git fetch flaking" scenario named above as the
      # reason it's best-effort), the whole restore silently no-ops and the
      # guard's REMOTE path never gets created either, so it read that as
      # "doesn't exist on the data branch" and passed -- exactly backwards
      # for the one case this guard exists to catch: we didn't determine
      # anything, we just failed to look. This revision does its own
      # independent, retried check (a shallow `git fetch` retried up to 3
      # times, then a local `git cat-file -e` against the fetched ref -- no
      # working-tree checkout needed) so a transient flake gets a second and
      # third chance instead of being silently read as "safe," and only a
      # genuine, repeated failure to determine the data branch's state stops
      # the job -- loudly, via exit 1, never by guessing.
      - name: Determine whether today's outcome log already exists on the data branch
        run: |
          PHX_TODAY=$(date -u -d '-7 hours' +%Y-%m-%d)
          echo "PHX_TODAY=${PHX_TODAY}" >> "$GITHUB_ENV"
          ATTEMPT=0
          MAX_ATTEMPTS=3
          until git fetch origin data --depth 1 -q; do
            ATTEMPT=$((ATTEMPT + 1))
            if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
              echo "::error::could not fetch origin/data after ${MAX_ATTEMPTS} attempts -- cannot determine whether outcome_log_${PHX_TODAY}.jsonl already exists there, and silently assuming it doesn't is exactly the failure mode this guard exists to catch. Refusing to continue."
              exit 1
            fi
            echo "git fetch origin data failed (attempt ${ATTEMPT}/${MAX_ATTEMPTS}) -- retrying in 5s..."
            sleep 5
          done
          if git cat-file -e "origin/data:public/data/current/outcome_log_${PHX_TODAY}.jsonl" 2>/dev/null; then
            echo "REMOTE_HAS_TODAY=1" >> "$GITHUB_ENV"
            echo "outcome_log_${PHX_TODAY}.jsonl exists on the data branch."
          else
            echo "REMOTE_HAS_TODAY=0" >> "$GITHUB_ENV"
            echo "No outcome_log_${PHX_TODAY}.jsonl on the data branch yet -- nothing to protect."
          fi

      - name: Verify today's own outcome log restored cleanly (if it exists on the data branch)
        run: |
          LOCAL="bots/outputs/outcome_log_${PHX_TODAY}.jsonl"
          if [ "${REMOTE_HAS_TODAY}" = "1" ] && [ ! -f "$LOCAL" ]; then
            echo "::error::data branch has outcome_log_${PHX_TODAY}.jsonl but it did not land in bots/outputs/ -- refusing to continue, which would silently reset today's revision history instead of just skipping the stale-date recheck."
            exit 1
          fi
          echo "Restore guard OK (REMOTE_HAS_TODAY=${REMOTE_HAS_TODAY})."

      # FIXED: this step used to call `python bots/grade_results.py`, a file
      # that does not exist in this repo -- the grader is
      # bots/live_results_tracker.py. Every scheduled run had been failing on
      # that line, which is why the Results tab never showed fresh grades.
      - name: Grade live results
        env:
          # Optional: set the DISCORD_WEBHOOK repo secret to get pool/pair
          # transition alerts (one-away, cashed) in Discord. Absent = no-op.
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          # 2026-08-22: same transition detector also queues a "pick cashed"
          # social draft (bots/social/pick_cashed.py) — needs this to get
          # captions written; absent it still queues, just with blank
          # captions for manual entry, same fallback as every other social
          # entrypoint.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python bots/live_results_tracker.py --date auto --live

      # The Results tab's "Final" view was permanently empty because nothing
      # ever produced results_final.json. live_results_tracker decides which
      # file to write from `live_mode`, and live_mode is forced True whenever
      # --date is auto/today/live -- so `--date auto --final-only` would STILL
      # have written results_live.json. The date has to be passed explicitly.
      #
      # It's read back off the breakdown file that the fetch step just wrote
      # rather than computed here, because "today" in Phoenix is not "today"
      # in UTC for the 1am/3am Phoenix crons, and the slate on the data branch
      # is whichever one the last Today run published.
      #
      # --final-only skips games still in progress, so the 7pm run grades the
      # handful that are done and each later run overwrites with a fuller set;
      # by the 3am run every game is final.
      - name: Grade final results
        run: |
          D=$(ls bots/outputs/mlb_breakdown_today_*.json 2>/dev/null \
              | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u | tail -1)
          if [ -z "$D" ]; then
            echo "No breakdown file found — nothing to grade as final."
            exit 0
          fi
          echo "Final-grading slate $D"
          python bots/live_results_tracker.py --date "$D" --final-only
        continue-on-error: true

      - name: Save SQLite cache
        uses: actions/cache/save@v4
        with:
          path: bots/mlb_hr_cache.sqlite
          key: sqlite-cache-${{ github.run_id }}

      # backtest_report.py aggregates across graded_results_*.txt files, but the
      # runner is ephemeral -- without this it would see exactly one day and the
      # "hit rate by tier" numbers would be single-slate noise. The data branch
      # is where the backlog actually lives.
      - name: Restore graded history from data branch
        run: |
          git fetch origin data --depth 1 2>/dev/null || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            rm -rf /tmp/histout && mkdir -p /tmp/histout public/data
            git archive origin/data public/data 2>/dev/null | tar -x -C /tmp/histout || true
            # -n so today's freshly graded file is never clobbered by the
            # published copy from an earlier run on the same date.
            cp -n /tmp/histout/public/data/current/graded_results_*.txt public/data/ 2>/dev/null || true
            # THE POOLED-METRICS FIX (2026-08-08, audit #12): backtest_report's
            # JSON parser emits the per-metric counts pooling needs, but this
            # restore only ever copied the .txt files — so the report fell back
            # to the text parser and pooled_metrics stayed empty forever. Copy
            # the JSON siblings and five more columns pool for free.
            cp -n /tmp/histout/public/data/current/graded_results_*.json public/data/ 2>/dev/null || true
            echo "Graded files available: $(find public/data -maxdepth 1 -name 'graded_results_*.txt' | wc -l)"
          fi
        continue-on-error: true

      # TRACK RECORD MATRIX (2026-08-07): the site's Track record table read a
      # frozen snapshot ending 06-22. Rebuild it nightly from the frozen base
      # (39 local-archive days that predate the branch) + every graded day the
      # branch holds + today's fresh file in bots/outputs. Published alongside
      # the other current/ artifacts; the site prefers this over its static
      # fallback copy.
      - name: Build pick matrix
        run: |
          mkdir -p public/data/current
          python bots/build_pick_matrix.py \
            --graded-dir /tmp/histout/public/data/current \
            --graded-dir bots/outputs \
            --base bots/data/pick_matrix_base.json \
            --out public/data/current/pick_matrix.json
        continue-on-error: true

      - name: Build backtest summary
        run: |
          mkdir -p public/data/current
          python bots/backtest_report.py --dir public/data --out-dir public/data/current
        continue-on-error: true

      # TRUE PRICE (2026-08-15, Donovan: "find the true price of a player to do
      # certian things"). Joins the pre-game odds snapshots the today workflow
      # dropped on the branch to the graded file for the SAME date, and settles
      # every priced prop against the box score. Rebuilt from scratch each run,
      # so it is a pure function of the archives -- a grading fix in November
      # recomputes every night back to the first one.
      #
      # graded-dir order matters: later directories win, and public/data holds
      # THIS run's fresh grading (the restore above used cp -n, so it could not
      # have clobbered it).
      - name: Build the true-price history
        run: |
          mkdir -p public/data/current
          python bots/odds_history.py \
            --odds-dir /tmp/histout/public/data/current \
            --graded-dir /tmp/histout/public/data/current \
            --graded-dir bots/outputs \
            --graded-dir public/data \
            --out public/data/current/odds_history.json
        continue-on-error: true

      - name: Publish to data branch
        run: bash .github/scripts/publish_data.sh "Graded results"
