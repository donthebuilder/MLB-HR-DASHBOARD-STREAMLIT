name: MLB HR Bot — Grade Results (data branch only)

on:
  schedule:
    # Phoenix is UTC-7 year-round.
    #
    # This used to be "0 2,4,6,8,10 * * *" -- 7pm, 9pm, 11pm, 1am and 3am
    # Phoenix. Every one of those is at or after the point most games have
    # ENDED, so the Results tab sat on a grade from the middle of the night
    # and showed 120 PENDING picks with 0 HRs all afternoon, right through
    # first pitch and the whole early slate. Nothing was broken; grading
    # simply never ran while the games were on.
    #
    # Now it runs hourly from 11am Phoenix (18:00 UTC) -- ahead of the
    # earliest first pitch -- through 3am Phoenix, covering every game from
    # the day slate to a West-coast extra-innings finish. Each run is ~40s.
    # Phoenix 9am-11pm hourly, plus 1am and 3am for the final sweep. Grading
    # now starts before first pitch so early games are picked up as they go,
    # not two hours after they end.
    - cron: "0 16,17,18,19,20,21,22,23,0,1,2,3,4,5,6,8,10 * * *"
  workflow_dispatch: {}

# One group PER WORKFLOW, not one shared across all of them.
# GitHub keeps at most a single *pending* run per concurrency group, so a
# shared group meant each newly queued run cancelled the previously queued
# one -- that's what silently killed the Tomorrow slate and the Grade Results
# run. Publishing races are handled in publish_data.sh instead, which
# re-reads the data branch immediately before it force-pushes.
concurrency:
  group: mlb-results
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  grade-results:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r bots/requirements.txt

      # Same corrected cache path as the picks workflow -- bots/cache.db
      # never existed, so this cache was doing nothing.
      - name: Restore SQLite cache
        uses: actions/cache@v4
        with:
          path: bots/mlb_hr_cache.sqlite
          key: sqlite-cache-${{ github.run_id }}
          restore-keys: |
            sqlite-cache-

      # The grader reads its picks from bots/outputs/, which is empty in a
      # fresh CI checkout. This pulls the published slate off the data branch
      # and writes it where the grader looks.
      - name: Fetch published picks
        run: python bots/fetch_picks_for_grading.py --date today

      # FIXED: this step used to call `python bots/grade_results.py`, a file
      # that does not exist in this repo -- the grader is
      # bots/live_results_tracker.py. Every scheduled run had been failing on
      # that line, which is why the Results tab never showed fresh grades.
      - name: Grade live results
        run: python bots/live_results_tracker.py --date auto --live

      # The Results tab's "Final" view was permanently empty because nothing
      # ever produced results_final.json. live_results_tracker decides which
      # file to write from `live_mode`, and live_mode is forced True whenever
      # --date is auto/today/live -- so `--date auto --final-only` would STILL
      # have written results_live.json. The date has to be passed explicitly.
      #
      # It's read back off the breakdown file that the fetch step just wrote
      # rather than computed here, because "today" in Phoenix is not "today"
      # in UTC for the 1am/3am Phoenix crons, and the slate on the data branch
      # is whichever one the last Today run published.
      #
      # --final-only skips games still in progress, so the 7pm run grades the
      # handful that are done and each later run overwrites with a fuller set;
      # by the 3am run every game is final.
      - name: Grade final results
        run: |
          D=$(ls bots/outputs/mlb_breakdown_today_*.json 2>/dev/null \
              | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | sort -u | tail -1)
          if [ -z "$D" ]; then
            echo "No breakdown file found — nothing to grade as final."
            exit 0
          fi
          echo "Final-grading slate $D"
          python bots/live_results_tracker.py --date "$D" --final-only
        continue-on-error: true

      - name: Save SQLite cache
        uses: actions/cache/save@v4
        with:
          path: bots/mlb_hr_cache.sqlite
          key: sqlite-cache-${{ github.run_id }}

      # backtest_report.py aggregates across graded_results_*.txt files, but the
      # runner is ephemeral -- without this it would see exactly one day and the
      # "hit rate by tier" numbers would be single-slate noise. The data branch
      # is where the backlog actually lives.
      - name: Restore graded history from data branch
        run: |
          git fetch origin data --depth 1 2>/dev/null || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            rm -rf /tmp/histout && mkdir -p /tmp/histout public/data
            git archive origin/data public/data 2>/dev/null | tar -x -C /tmp/histout || true
            # -n so today's freshly graded file is never clobbered by the
            # published copy from an earlier run on the same date.
            cp -n /tmp/histout/public/data/current/graded_results_*.txt public/data/ 2>/dev/null || true
            echo "Graded files available: $(find public/data -maxdepth 1 -name 'graded_results_*.txt' | wc -l)"
          fi
        continue-on-error: true

      - name: Build backtest summary
        run: |
          mkdir -p public/data/current
          python bots/backtest_report.py --dir public/data --out-dir public/data/current
        continue-on-error: true

      - name: Publish to data branch
        run: bash .github/scripts/publish_data.sh "Graded results"
