name: MLB HR Bot — Today (data branch only)

on:
  schedule:
    # DAY ROLLOVER.
    #
    # ORIGINAL 2026-08-09 VERSION (superseded 2026-08-28, kept for the
    # record): rolled over at 10:30 UTC / 3:30am Phoenix, deliberately AFTER
    # the latest West-coast last-out this data had ever produced (measured at
    # the time: 08:45 UTC worst case for an 18-inning game), so the board
    # never flipped to a new projected day while a live West-coast pick was
    # still on the field. The trade-off that bought: an Arizona/Pacific
    # reader got a board that had gone stale at midnight and didn't refresh
    # for another 3.5 hours.
    #
    # CHANGED 2026-08-28 (Donovan, explicit): reset exactly at midnight
    # Phoenix, so the site turns over the moment his day does, full stop --
    # not after games clear. He was walked through the trade-off above
    # (an extra-innings West-coast game can still be live at rollover; that
    # night the board shows tomorrow's projected slate before last night's
    # last pick is graded) and chose midnight anyway. results.yml already
    # grades every hour on the hour +10 (`10 * * * *`), so last night keeps
    # getting graded on its normal cadence after the rollover -- this only
    # changes when the DISPLAY flips days, not whether grading continues.
    - cron: "5 7 * * *"   # 12:05am Phoenix/PT (Phoenix is UTC-7, no DST) - the day rolls over
    #
    # UTC times = 5am, 8am, 11am, 1pm, 3pm, 4pm, 5pm, 6pm Phoenix (Phoenix is UTC-7 year-round)
    # Phoenix 5am, 8am, then hourly 9am-6pm. The 9am-2:30pm block is the
    # lineup-drop window -- a slate scored before lineups post is a guess at
    # who is even playing.
    - cron: "0 12,15,16,17,18,19,20,21,22,23,0,1 * * *"
    - cron: "30 21 * * *"   # 2:30pm Phoenix - most lineups are in by now
    # HALF-HOURLY THROUGH THE LINEUP WINDOW (2026-08-14, Donovan: "add a few
    # more slate runs to catch the lineups").
    #
    # The block above is hourly, and a card can post at any minute inside it --
    # so a lineup landing at 16:05 UTC was not picked up until 17:00, and
    # lineup_confirmed carries 0.17 weight in the blend plus its own HR2
    # multiplier. Up to 55 minutes of every slate was being scored on a
    # projection that had already been superseded.
    #
    # These are the :30s for 9am-4:30pm Phoenix, the window cards actually drop
    # in (21:30 is already covered by the line above). Outside it the hourly
    # cadence is fine: nothing posts a lineup at 4am.
    - cron: "30 16,17,18,19,20,22,23 * * *"
    #
    # LATE-CARD SWEEP (2026-08-10, by request: "add any more as possible").
    #
    # The block above ends at 01:00 UTC / 6pm Phoenix / 9pm ET. A West-coast
    # 7:10pm PT game starts at 02:10 UTC, and a scratch to that card can land
    # as late as ~01:40 UTC -- forty minutes after the bot has stopped looking.
    # Until tonight nothing caught that: the slate carried the old name until
    # the next morning's rollover, and lineup_confirmed for those games was
    # decided before the card was final.
    #
    # That matters to the SCORE, not just the display. extract_lineup() sets
    # lineup_confirmed, which moves lineup_raw from 65 to 100 and carries 0.17
    # weight in the blend plus its own HR2 multiplier -- so a West-coast game
    # whose card lands after 01:00 was being scored on a projection all night.
    #
    # 02:00 and 03:00 UTC (7pm and 8pm Phoenix) close it. These runs happen
    # while East-coast games are in progress, which is not new -- the 01:00 run
    # already does -- and pick_lock.py freezes each game's designations at ITS
    # first pitch, so a rebuild at 8pm cannot rewrite a pick that has already
    # started. Late games are still pre-lock and get the corrected card.
    - cron: "0 2,3 * * *"   # 7pm, 8pm Phoenix - late West-coast cards
  workflow_dispatch: {}

# One group PER WORKFLOW, not one shared across all of them.
# GitHub keeps at most a single *pending* run per concurrency group, so a
# shared group meant each newly queued run cancelled the previously queued
# one -- that's what silently killed the Tomorrow slate and the Grade Results
# run. Publishing races are handled in publish_data.sh instead, which
# re-reads the data branch immediately before it force-pushes.
concurrency:
  group: mlb-today
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Bot deps only. The root requirements.txt is now the Streamlit app's
      # (light) dependency list so Streamlit Cloud boots fast; pybaseball and
      # friends live in bots/requirements.txt.
      - name: Install deps
        run: pip install -r bots/requirements.txt

      # Cache path now matches what the bot actually uses:
      # mlb_dashboard.py -> DB_PATH = ROOT_DIR / "mlb_hr_cache.sqlite", where
      # ROOT_DIR is the script's own folder. The old bots/cache.db path was
      # never read or written, so the cache was silently a no-op every run.
      - name: Restore SQLite cache
        uses: actions/cache@v4
        with:
          path: bots/mlb_hr_cache.sqlite
          key: sqlite-cache-${{ github.run_id }}
          restore-keys: |
            sqlite-cache-

      # bots/today_bot.py was replaced by bots/mlb_dashboard.py. It builds one
      # slate per invocation and writes public/data itself (today.json,
      # today.txt, current/, history/, index.json, pair_builder_latest.json),
      # including pulling confirmed lineups inline -- which is why the old
      # standalone "Check lineups" step is gone. Nothing consumed the
      # lineups.json it produced.
      - name: Run scoring bot (today)
        env:
          # Optional: slate-board Discord posts when picks change (silent without it)
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python bots/mlb_dashboard.py --today

      # 📌 THE LOCK (2026-08-09). Runs BEFORE make_slim so the correction
      # happens once, at the source, and every downstream file inherits it.
      #
      # build_game_pick_role_map() recomputes every designation from scratch on
      # all thirteen daily runs, and it ranks on inputs that move during the
      # day (last5_hr updates as early games finish, lineups go from projected
      # to real). So a pick made at 11am could silently belong to someone else
      # by 4pm — reported by Donovan as "two people who were on the bot that
      # went, then later it says the bot didn't have them at all."
      #
      # This freezes each game's designations at ITS first pitch and rewrites
      # the sheet to match. Pre-game re-picks stay legal and are logged; a
      # change after first pitch is refused and announced. The receipts card
      # has claimed "locked at first pitch, never edited" for weeks — this is
      # the step that makes that sentence true.
      # 2026-08-10: this step's AttributeError turned a SUCCESSFUL slate build
      # red and stopped the workflow before publishing. The scoring step above
      # had already printed "FINISHED TODAY BOT" — the slate existed, and a
      # bookkeeping job killed the run anyway.
      #
      # pick_lock records which name was designated at first pitch. Useful, and
      # not worth a night's slate. continue-on-error surfaces the failure in the
      # Actions UI without letting it stop anything downstream.
      # ODDS. Runs BEFORE the lock so odds_latest.json exists for the same
      # publish, and after the scoring bot so today.json is there to join names
      # against. continue-on-error and a soft-fail inside the script both: a
      # book outage, a spent quota or an unset key must never cost you a slate.
      - name: Fetch odds
        continue-on-error: true
        env:
          # Three providers, tried in order, first one with quotes wins. Order
          # is a repo VARIABLE so it can change without a code edit; the
          # default leads with odds-api.io.
          ODDSAPI_IO_KEY: ${{ secrets.ODDSAPI_IO_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          # Last resort: its free tier is 250 requests a MONTH against a
          # workflow that fires 13 times a day, so it must only ever run when
          # the two above came back empty.
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          ODDS_PROVIDER_ORDER: ${{ vars.ODDS_PROVIDER_ORDER }}
          ODDSAPI_IO_BOOKMAKERS: ${{ vars.ODDSAPI_IO_BOOKMAKERS }}
          # THE REQUEST LOCK. This workflow fires thirteen times a day and
          # every run used to be a full fetch. Prices barely move inside an
          # hour, so twelve of those thirteen bought nothing and spent the
          # quota the one that matters -- the last snapshot before first pitch
          # -- depends on. Defaults (90 min apart, 5 per slate) land around
          # five fetches a day; both are repo variables so they can be tuned
          # without a code change.
          ODDS_MIN_INTERVAL_MIN: ${{ vars.ODDS_MIN_INTERVAL_MIN }}
          ODDS_MAX_PER_SLATE: ${{ vars.ODDS_MAX_PER_SLATE }}
        run: python bots/odds_fetch.py --out public/data/current

      # POR_LOG RESTORE (2026-08-22, 9b-fix defect A). pick_lock.py's
      # append_por_log() appends to public/data/current/por_log_<date>.jsonl
      # ON THE RUNNER'S DISK -- and a fresh checkout starts without the locks
      # earlier runs already took. por_newly_locked only ever contains
      # game_pks newly locked THIS run (`if gp in por: continue`), and
      # publish_data.sh's carry_forward() re-copies only what a run DIDN'T
      # produce -- so without this restore, every today.yml run published a
      # por_log holding only its own new locks and wiped every earlier lock
      # for the same date. Observed in production on 9b's first live night
      # (2026-08-22): the file held 2 locked games at 19:30 UTC and 1 at
      # 22:37. A lock, once lost, is not re-derivable -- which is the entire
      # reason append_por_log()'s own docstring gives for the file existing.
      # Same restore-then-guard shape results.yml uses for outcome_log_*
      # (Sol audit #2 finding #5): a best-effort restore, then a separate
      # hard-failing guard so a silent restore failure cannot masquerade as
      # "no locks yet."
      - name: Restore prediction-of-record locks from the data branch
        continue-on-error: true
        run: |
          git fetch origin data --depth 1 2>/dev/null || true
          if git rev-parse --verify origin/data >/dev/null 2>&1; then
            rm -rf /tmp/por-restore && mkdir -p /tmp/por-restore
            git archive origin/data public/data 2>/dev/null | tar -x -C /tmp/por-restore || true
            mkdir -p public/data/current
            cp /tmp/por-restore/public/data/current/por_log_*.jsonl public/data/current/ 2>/dev/null || true
            echo "Restored $(ls public/data/current/por_log_*.jsonl 2>/dev/null | wc -l) por_log file(s)."
          fi

      - name: Verify today's own por_log restored cleanly (if it exists on the data branch)
        run: |
          PHX_TODAY="$(TZ=America/Phoenix date +%F)"
          if ! git rev-parse --verify origin/data >/dev/null 2>&1; then
            echo "origin/data not fetchable -- cannot verify; continuing (first-ever run shape)."
            exit 0
          fi
          if git cat-file -e "origin/data:public/data/current/por_log_${PHX_TODAY}.jsonl" 2>/dev/null; then
            if [ ! -f "public/data/current/por_log_${PHX_TODAY}.jsonl" ]; then
              echo "::error::data branch has por_log_${PHX_TODAY}.jsonl but it did not land in public/data/current/ -- refusing to continue, which would let pick_lock.py rebuild today's lock history from scratch and publish it over the real one."
              exit 1
            fi
            echo "por_log_${PHX_TODAY}.jsonl restored ($(grep -c . "public/data/current/por_log_${PHX_TODAY}.jsonl") lock line(s))."
          else
            echo "No por_log_${PHX_TODAY}.jsonl on the data branch yet -- nothing to protect."
          fi

      - name: Lock designations at first pitch
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python bots/pick_lock.py --apply

      # Shrinks the 76 MB slate JSON to ~3 MB for the Streamlit app by
      # dropping the per-player raw logs the dashboard never reads. Only the
      # slim file is published; the full one stays on the runner.
      # Exits 2 and FAILS THIS STEP when the slate it's handed isn't a slate,
      # which aborts the job before the publish step below — so the data branch
      # keeps its last good slate rather than being overwritten by a fragment.
      # See the publish guard in make_slim.py; 2026-08-09 is why it exists.
      - name: Build slim payload for Streamlit
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python bots/make_slim.py

      # ── DID THE DETAIL ACTUALLY GET BUILT? (2026-08-29) ────────────────
      # The per-player layer -- spray charts, contact logs, pitch profiles,
      # pitcher arsenals and lineup-spot damage -- went stale on the live
      # branch and nothing anywhere went red. Both detail directories held a
      # coherent snapshot of a night that was on NEITHER slate file beside
      # them, and the only visible symptom was a modal saying "no detail file
      # published" for 27 of 30 starters.
      #
      # make_slim.py now stamps each directory it writes. This step asserts
      # the stamp matches the slate this run just built. It is
      # continue-on-error ON PURPOSE: a broken detail layer must be loud, but
      # it must not cost the night its slate -- publish_data.sh drops a
      # mismatched directory on its own, so the board still ships and the
      # site honestly says the detail is missing.
      - name: Verify the today detail directory matches this run's slate
        continue-on-error: true
        run: |
          MAN="public/data/current/detail/today/_manifest.json"
          META="public/data/current/today_run_meta.json"
          if [ ! -f "$MAN" ]; then
            echo "::error::make_slim wrote no detail manifest for the today slate -- the per-player layer was not rebuilt this run."
            exit 1
          fi
          WANT="$(sed -n 's/.*"slate_date"[[:space:]]*:[[:space:]]*"\([0-9-]\{10\}\)".*/\1/p' "$META" 2>/dev/null | head -n 1)"
          HAVE="$(sed -n 's/.*"slate_date"[[:space:]]*:[[:space:]]*"\([0-9-]\{10\}\)".*/\1/p' "$MAN" | head -n 1)"
          PITCHERS="$(sed -n 's/.*"pitcher_count"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p' "$MAN" | head -n 1)"
          BATTERS="$(sed -n 's/.*"batter_count"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p' "$MAN" | head -n 1)"
          echo "detail/today: slate=$HAVE (run meta says $WANT), $BATTERS batters, $PITCHERS pitchers"
          if [ -n "$WANT" ] && [ "$WANT" != "$HAVE" ]; then
            echo "::error::detail/today is stamped $HAVE but this run built $WANT."
            exit 1
          fi
          if [ "${PITCHERS:-0}" -lt 1 ]; then
            echo "::error::detail/today has no pitcher files -- every arsenal and pitch-mix chart on the site will be blank for this slate."
            exit 1
          fi

      # Day/night, home/away, day-of-week and win/loss splits. The
      # scoring bot only carries vs-RHP/LHP, so these come from MLB's
      # gameLog endpoint -- one request per hitter, ~2 min for a slate.
      - name: Build situational splits
        run: python bots/player_splits.py --slate public/data/current/today.json --label today
        continue-on-error: true

      - name: Save SQLite cache
        uses: actions/cache/save@v4
        with:
          path: bots/mlb_hr_cache.sqlite
          key: sqlite-cache-${{ github.run_id }}

      - name: Publish to data branch
        run: bash .github/scripts/publish_data.sh "Today slate"
