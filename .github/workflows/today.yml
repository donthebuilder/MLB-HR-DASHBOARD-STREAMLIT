name: MLB HR Bot — Today (data branch only)

on:
  schedule:
    # DAY ROLLOVER (2026-08-09, by request): "update for the next slate at a
    # good time for America while still showing the slate for the other half
    # of America."
    #
    # The site has no clock of its own -- it renders whatever today_slim.json
    # holds -- so the moment the board becomes the new day IS the moment this
    # workflow's first run of the day publishes. That was 12:00 UTC, which is
    # 8am Eastern. An East-coast reader up at 6am got a board that had been
    # dead since the last out.
    #
    # The constraint pulling the other way is the West coast: roll over too
    # early and someone in California watching the end of a 10pm PT game loses
    # tonight's board out from under them. So the honest question is how late
    # baseball actually runs, and that is measurable rather than guessable.
    # Across 34 graded nights the LATEST first pitch of any night was 02:15 UTC
    # (7:15pm PT). Adding game length to that worst case:
    #
    #     a normal 3h00 game       last out ~05:15 UTC  (10:15pm PT)
    #     3h30                             ~05:45 UTC  (10:45pm PT)
    #     extras, ~4h15                    ~06:30 UTC  (11:30pm PT)
    #     a 15-inning marathon             ~07:45 UTC  (12:45am PT)
    #     18 innings                       ~08:45 UTC  ( 1:45am PT)
    #
    # 10:30 UTC clears even the 18-inning case by 105 minutes, and lands at
    # 3:30am PT / 6:30am ET -- after the last possible West-coast out, before
    # the East coast is awake. It also sits after the 10:00 UTC final grading
    # sweep in results.yml, so last night is fully graded before the board
    # turns over rather than during.
    #
    # This is a rollover, not a lineup build: at 3:30am nobody has posted a
    # lineup, so the early slate is projected and the 12:00 UTC run and the
    # whole 9am-2:30pm block still do the real work. The point is that the
    # board shows the right DAY, not that it is final at 6:30am.
    - cron: "30 10 * * *"   # 3:30am Phoenix/PT, 6:30am ET - the day rolls over
    #
    # UTC times = 5am, 8am, 11am, 1pm, 3pm, 4pm, 5pm, 6pm Phoenix (Phoenix is UTC-7 year-round)
    # Phoenix 5am, 8am, then hourly 9am-6pm. The 9am-2:30pm block is the
    # lineup-drop window -- a slate scored before lineups post is a guess at
    # who is even playing.
    - cron: "0 12,15,16,17,18,19,20,21,22,23,0,1 * * *"
    - cron: "30 21 * * *"   # 2:30pm Phoenix - most lineups are in by now
  workflow_dispatch: {}

# One group PER WORKFLOW, not one shared across all of them.
# GitHub keeps at most a single *pending* run per concurrency group, so a
# shared group meant each newly queued run cancelled the previously queued
# one -- that's what silently killed the Tomorrow slate and the Grade Results
# run. Publishing races are handled in publish_data.sh instead, which
# re-reads the data branch immediately before it force-pushes.
concurrency:
  group: mlb-today
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Bot deps only. The root requirements.txt is now the Streamlit app's
      # (light) dependency list so Streamlit Cloud boots fast; pybaseball and
      # friends live in bots/requirements.txt.
      - name: Install deps
        run: pip install -r bots/requirements.txt

      # Cache path now matches what the bot actually uses:
      # mlb_dashboard.py -> DB_PATH = ROOT_DIR / "mlb_hr_cache.sqlite", where
      # ROOT_DIR is the script's own folder. The old bots/cache.db path was
      # never read or written, so the cache was silently a no-op every run.
      - name: Restore SQLite cache
        uses: actions/cache@v4
        with:
          path: bots/mlb_hr_cache.sqlite
          key: sqlite-cache-${{ github.run_id }}
          restore-keys: |
            sqlite-cache-

      # bots/today_bot.py was replaced by bots/mlb_dashboard.py. It builds one
      # slate per invocation and writes public/data itself (today.json,
      # today.txt, current/, history/, index.json, pair_builder_latest.json),
      # including pulling confirmed lineups inline -- which is why the old
      # standalone "Check lineups" step is gone. Nothing consumed the
      # lineups.json it produced.
      - name: Run scoring bot (today)
        env:
          # Optional: slate-board Discord posts when picks change (silent without it)
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python bots/mlb_dashboard.py --today

      # 📌 THE LOCK (2026-08-09). Runs BEFORE make_slim so the correction
      # happens once, at the source, and every downstream file inherits it.
      #
      # build_game_pick_role_map() recomputes every designation from scratch on
      # all thirteen daily runs, and it ranks on inputs that move during the
      # day (last5_hr updates as early games finish, lineups go from projected
      # to real). So a pick made at 11am could silently belong to someone else
      # by 4pm — reported by Donovan as "two people who were on the bot that
      # went, then later it says the bot didn't have them at all."
      #
      # This freezes each game's designations at ITS first pitch and rewrites
      # the sheet to match. Pre-game re-picks stay legal and are logged; a
      # change after first pitch is refused and announced. The receipts card
      # has claimed "locked at first pitch, never edited" for weeks — this is
      # the step that makes that sentence true.
      - name: Lock designations at first pitch
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python bots/pick_lock.py --apply

      # Shrinks the 76 MB slate JSON to ~3 MB for the Streamlit app by
      # dropping the per-player raw logs the dashboard never reads. Only the
      # slim file is published; the full one stays on the runner.
      # Exits 2 and FAILS THIS STEP when the slate it's handed isn't a slate,
      # which aborts the job before the publish step below — so the data branch
      # keeps its last good slate rather than being overwritten by a fragment.
      # See the publish guard in make_slim.py; 2026-08-09 is why it exists.
      - name: Build slim payload for Streamlit
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python bots/make_slim.py

      # Day/night, home/away, day-of-week and win/loss splits. The
      # scoring bot only carries vs-RHP/LHP, so these come from MLB's
      # gameLog endpoint -- one request per hitter, ~2 min for a slate.
      - name: Build situational splits
        run: python bots/player_splits.py --slate public/data/current/today.json --label today
        continue-on-error: true

      - name: Save SQLite cache
        uses: actions/cache/save@v4
        with:
          path: bots/mlb_hr_cache.sqlite
          key: sqlite-cache-${{ github.run_id }}

      - name: Publish to data branch
        run: bash .github/scripts/publish_data.sh "Today slate"
