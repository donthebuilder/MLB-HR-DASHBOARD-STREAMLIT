name: NFL Bot — slate + report card (data branch only)

# FOOTBALL IS NOT BASEBALL, and the schedule is where that shows up first.
# The MLB bot runs ~14 times a day, every day, because the slate turns over
# nightly and lineups drop in a rolling window. The NFL gives you one slate a
# week, three kickoff waves, and an injury report that only moves on
# Wednesday, Friday and 90 minutes before kickoff. Running this hourly would
# burn Actions minutes to republish an identical file.
#
# All times UTC. Phoenix is UTC-7 year-round.

on:
  schedule:
    # OFF THE HOUR (2026-09-27): GitHub drops scheduled runs under load, worst at
    # :00 and :30 (09-25: results ran 7 of ~64 slots, today 11 of 24). Minutes
    # moved 3-7 later; the Vercel dispatcher (/api/gh/dispatch) backs them up.
    # ── the weekly spine ──
    - cron: "3 13 * * 2"    # Tue 6am PHX  — week opens, the league's data lands
    - cron: "3 23 * * 3"    # Wed 4pm PHX  — first practice report
    - cron: "3 21 * * 4"    # Thu 2pm PHX  — TNF lock
    - cron: "33 4 * * 5"    # Thu 9:30pm PHX — grade TNF
    - cron: "3 23 * * 5"    # Fri 4pm PHX  — official Q/D/O designations
    # ── Sunday ──
    - cron: "3 15 * * 0"    # Sun 8am PHX  — main slate build
    - cron: "33 18 * * 0"   # Sun 11:30am PHX — inactives, 90 min before the 1pm ET wave
    - cron: "33 20,23 * * 0" # Sun 1:30pm / 4:30pm PHX — live waves
    - cron: "33 3 * * 1"    # Sun 8:30pm PHX — night game
    - cron: "3 7 * * 1"     # Sun midnight PHX — final grade
    # ── Monday ──
    - cron: "3 0 * * 2"     # Mon 5pm PHX  — MNF lock
    - cron: "33 6 * * 2"    # Mon 11:30pm PHX — close the week
    # ── PREGAME CADENCE (2026-10-01, BATCH GAME CALLS) ──
    # The game calls lock at each kickoff, and NFL inactives post ~90 min
    # before it, so the build must run at least every 15 min from T-120 to
    # every kickoff. The spine above does not: Sunday's "inactives" slot
    # (18:33Z = 2:33pm EDT) is AFTER the 1pm kickoff (its comment's PHX math
    # is off by 90 min), and TNF / SNF / MNF / London had one run, or none,
    # inside T-120. These slots fire every 15 min on :08/:23/:38/:53 (off the
    # spine's :03/:33 so they never double a run) across every window, both
    # EDT and EST. The `gate` job below lets one through ONLY when a game on
    # the published nfl_week.json kicks off within the next 125 min; every
    # other slot ends in seconds without building. Covered: TNF, Thanksgiving
    # Thu, Sun London 9:30am ET / 1pm / 4pm / SNF, MNF (incl. a 7pm double).
    # Not covered yet: Saturday games (late season), Black Friday, Christmas.
    - cron: "8,23,38,53 14-23 * * 4"   # Thu: Thanksgiving + TNF windows
    - cron: "8,23,38,53 0-1 * * 5"     # Thu night ET (TNF in EST)
    - cron: "8,23,38,53 11-23 * * 0"   # Sun: London, 1pm, 4pm, SNF run-up
    - cron: "8,23,38,53 0-1 * * 1"     # Sun night ET (SNF kickoff, EST)
    - cron: "8,23,38,53 21-23 * * 1"   # Mon: MNF run-up
    - cron: "8,23,38,53 0-1 * * 2"     # Mon night ET (MNF kickoff, EST)
  workflow_dispatch:
    inputs:
      mode:
        description: "auto, preseason or week"
        required: false
        default: "auto"
      week:
        description: "regular-season week number (week mode only)"
        required: false
        default: ""
      report:
        description: "also rebuild the report card (slow — full backtest)"
        required: false
        default: "false"

# Its own group, per the lesson in today.yml: a group shared across workflows
# made GitHub cancel queued runs and silently killed whole publishes.
concurrency:
  group: nfl-slate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # THE GATE (2026-10-01). Only the pregame-cadence crons (minute 8/23/38/53)
  # are gated; the spine, a manual run and a Vercel-dispatched backup always
  # go. A gated slot builds only when a published game kicks off within the
  # next 125 min. If the week file can't be read, it builds (fail open).
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      go: ${{ steps.g.outputs.go }}
    steps:
      - id: g
        env:
          EVENT: ${{ github.event_name }}
          SCHED: ${{ github.event.schedule }}
        run: |
          python3 - <<'EOF'
          import datetime as dt, json, os, urllib.request
          ev, sched = os.environ.get("EVENT", ""), os.environ.get("SCHED", "")
          go, why = True, "not a pregame-cadence slot"
          if ev == "schedule" and sched.startswith("8,23,38,53 "):
              url = ("https://raw.githubusercontent.com/donthebuilder/MLB-HR-DASHBOARD-STREAMLIT/"
                     "data/public/data/current/nfl_week.json")
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      games = (json.loads(r.read()) or {}).get("games") or []
                  now = dt.datetime.now(dt.timezone.utc)
                  soon = []
                  for g in games:
                      try:
                          ko = dt.datetime.fromisoformat(str(g.get("kickoff")).replace("Z", "+00:00"))
                      except ValueError:
                          continue
                      if now < ko <= now + dt.timedelta(minutes=125):
                          soon.append(f"{g.get('away')}@{g.get('home')} {g.get('kickoff')}")
                  go = bool(soon)
                  why = ("kickoff within 125 min: " + ", ".join(soon)) if soon else "no kickoff within 125 min"
              except Exception as exc:
                  go, why = True, f"week file unreadable ({type(exc).__name__}) -- building anyway"
          print(f"gate: {'GO' if go else 'skip'} -- {why}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"go={'true' if go else 'false'}\n")
          EOF

  run-nfl-bot:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r bots/nfl/requirements.txt

      # nflreadpy caches the parquet releases it downloads. Play-by-play for a
      # season is ~50MB and the feature build reads two seasons, so a cold
      # cache costs a couple of minutes every run for files that only change
      # once a week.
      - name: Restore nflverse cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/nflreadpy
          key: nflverse-${{ github.run_id }}
          restore-keys: |
            nflverse-

      # MODE. Preseason until the regular season starts, because nflverse
      # carries no preseason at all and the whole board has to come from last
      # season's baselines. A manual dispatch can force either.
      - name: Decide mode
        id: mode
        run: |
          set -euo pipefail
          # This used to be `date -u < 2026-09-09` written here in YAML. Two
          # things were wrong with that: it needed hand-editing every August,
          # and it put the first week-mode run at Wed 23:00Z -- eighty minutes
          # before the Week 1 kickoff it was meant to price. The season's own
          # schedule knows when the season starts, so ask it.
          MODE="${{ github.event.inputs.mode || 'auto' }}"
          if [ "$MODE" = "auto" ]; then
            MODE=$(cd bots/nfl && python -c "from nfl_bot import _regular_season_is_near; print('week' if _regular_season_is_near(2026) else 'preseason')")
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Running in $MODE mode"

      # EVERY ROSTER (2026-09-24). Active + IR + practice squad with gsis_id,
      # for search and for the live TD feed's name join. One nflverse call.
      - name: Cache every roster
        continue-on-error: true
        working-directory: bots/nfl
        run: python nfl_roster.py --season 2026 --out "$GITHUB_WORKSPACE/public/data/current" --prefix nfl_

      # GAME CALLS LOCK LOG (2026-10-01, BATCH GAME CALLS G1). Restored BEFORE
      # the build, because the build appends to it: nfl_game_calls_log_*.jsonl
      # is append-only, one line per game per pregame build, and a run that
      # started from an empty file would publish only its own rows over the
      # week's history (the por_log lesson, 2026-09-24). Graded weeks and the
      # season totals come back too, so grading never regrades a game and the
      # totals are summed over every week. If the branch has a file that did
      # not land, NFL_GAME_CALLS_RESTORED=0 and nfl_game_calls.py stands down
      # (no append, no grade) -- this run loses its rows, the history does not,
      # and the slate still publishes.
      - name: Restore NFL game-call logs from the data branch
        run: |
          set -uo pipefail
          ok=1
          # A failed fetch is NOT a first run (bot audit 10-05): it used to be
          # `|| true`, so a transient failure restored nothing and this run's
          # append-only log replaced the week's history. fetch_data_branch.sh:
          # 0 fetched, 3 branch genuinely absent, 1 failed -> stop here.
          fetch_rc=0
          bash .github/scripts/fetch_data_branch.sh || fetch_rc=$?
          if [ "$fetch_rc" = 1 ]; then
            echo "::error::could not fetch origin/data -- refusing to treat a failed read as a first run (game-call logs would be replaced)."
            exit 1
          fi
          if [ "$fetch_rc" = 0 ] && git rev-parse --verify origin/data >/dev/null 2>&1; then
            mkdir -p public/data/current
            files=$(git ls-tree --name-only origin/data public/data/current/ | grep -E 'nfl_game_calls_(log_.*\.jsonl|graded_.*\.json|totals_.*\.json)$' || true)
            for f in $files; do
              git show "origin/data:$f" > "$f" 2>/dev/null || true
              if [ ! -s "$f" ]; then
                echo "::warning::$(basename "$f") is on the data branch but did not restore -- game calls will not append or grade this run."
                ok=0
              fi
            done
            echo "Restored $(echo "$files" | grep -c . || true) game-call file(s)."
          else
            echo "origin/data does not exist -- first-run shape; nothing to restore."
          fi
          echo "NFL_GAME_CALLS_RESTORED=$ok" >> "$GITHUB_ENV"

      - name: Build slate
        working-directory: bots/nfl
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/public/data/current"
          ARGS="--mode ${{ steps.mode.outputs.mode }} --season 2026"
          if [ -n "${{ github.event.inputs.week }}" ]; then
            ARGS="$ARGS --week ${{ github.event.inputs.week }}"
          fi
          python nfl_bot.py $ARGS \
            --out "$GITHUB_WORKSPACE/public/data/current" --prefix nfl_

      # NEXT WEEK, EVERY RUN (2026-09-18). Donovan: "every time the nfl bot
      # run it just runs for both this week and next week." TUDDY's header
      # gains a This week / Next week switch to match MOONSHOT's Today / Tmrw,
      # and MOONSHOT's Tmrw is a full board, not a schedule stub -- so this is
      # the same build, one week ahead, under its own nfl_next_ prefix.
      #
      # No bot code changed: --week and --prefix already exist, which is why
      # the prediction log this run writes is nfl_next_prediction_log_*.jsonl
      # and does NOT match publish_data.sh's NFL_PRED_LOG_GLOB. That matters:
      # next week's numbers must never enter the graded record. Same for the
      # picks archive (nfl_next_picks_<season>_w<NN>.json, unmatched) and the
      # card lock, which only ever reads nfl_picks.json.
      #
      # continue-on-error on purpose: a look-ahead board is the least
      # important thing this workflow produces, and it must never cost the
      # real slate a publish.
      - name: Build next week
        continue-on-error: true
        if: steps.mode.outputs.mode == 'week'
        working-directory: bots/nfl
        run: |
          set -euo pipefail
          CUR="$GITHUB_WORKSPACE/public/data/current/nfl_week.json"
          WEEK=$(python -c "import json;d=json.load(open('$CUR'));w=d.get('week');print(w if isinstance(w,int) else '')")
          if [ -z "$WEEK" ]; then
            echo "this run priced no numbered week -- nothing to look ahead from"
            exit 0
          fi
          NEXT=$((WEEK + 1))
          # 18 is the regular season. Past it the schedule itself stops
          # answering (see nfl_bot.main's "nothing left to price" branch), so
          # stop here rather than publish a board for a week that doesn't exist.
          if [ "$NEXT" -gt 18 ]; then
            echo "week $WEEK is the last regular-season week -- no next week to build"
            exit 0
          fi
          echo "building week $NEXT as the look-ahead board"
          python nfl_bot.py --mode week --season 2026 --week "$NEXT" \
            --out "$GITHUB_WORKSPACE/public/data/current" --prefix nfl_next_

      # ODDS. Runs right after the slate build so nfl_week.json exists for the
      # name join, same ordering rule today.yml uses for the MLB fetch.
      # continue-on-error and a soft-fail inside the script both: a book
      # outage, a spent quota or an unset key must never cost a slate publish.
      #
      # Same three secrets today.yml's MLB fetch step uses -- they are repo
      # secrets, not MLB-specific, so nothing new to provision. Only ONE
      # provider is ported here (see nfl_odds_fetch.py's module docstring for
      # why); ODDS_PROVIDER_ORDER / ODDSAPI_IO_BOOKMAKERS are MLB's multi-
      # provider knobs and don't apply to this script, so they're not passed.
      - name: Fetch NFL odds
        continue-on-error: true
        working-directory: bots/nfl
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDSAPI_IO_KEY: ${{ secrets.ODDSAPI_IO_KEY }}
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          # NFL fires ~12x/week (this file's own cron list), nowhere near
          # MLB's 13x/day, so the lock exists only to stop back-to-back manual
          # re-runs from burning quota, not to ration a busy schedule. A repo
          # variable so it can be tuned without a code change, same as MLB's.
          NFL_ODDS_MIN_INTERVAL_MIN: ${{ vars.NFL_ODDS_MIN_INTERVAL_MIN }}
        run: python nfl_odds_fetch.py --out "$GITHUB_WORKSPACE/public/data/current"

      # The report card is a full backtest over two seasons — minutes, not
      # seconds, and it only changes when the WEIGHTS change, not when the
      # slate does. So it rebuilds on the Tuesday open and on demand, never on
      # a live Sunday wave where the runner should be turning a slate around
      # fast.
      - name: Rebuild report card
        if: github.event.inputs.report == 'true' || github.event.schedule == '3 13 * * 2'
        working-directory: bots/nfl
        run: |
          python export_report.py --seasons 2024 2025 \
            --out "$GITHUB_WORKSPACE/public/data/current" --prefix nfl_

      # RESTORE BEFORE LOCK (2026-09-24 audit, MODEL-1). today.yml has had
      # this since 2026-08-22 ("9b-fix defect A"); nfl.yml never got it, so
      # nfl_pick_lock.py only ever saw the prediction log THIS run wrote --
      # on a Sunday afternoon that is a post-kickoff log, and every game
      # locked to it as rows_standing / locked_late -- and append_por_log()
      # started from an empty file, so each run's nfl_por_log_<season>_wNN
      # replaced the branch copy with just its own locks. Measured on the
      # data branch 2026-09-24: week 2 = ONE row (locked_late), week 3 = zero.
      # Same restore-then-guard shape as today.yml: best-effort restore, then
      # a separate hard-failing guard so a silent restore failure cannot
      # masquerade as "no locks yet."
      - name: Restore NFL prediction-of-record locks and pregame logs from the data branch
        # NOT continue-on-error (bot audit 10-05): a failed fetch here used to
        # read as "first run", the lock then rebuilt every slot from this run's
        # post-kickoff log and published a por_log of only its own locks.
        run: |
          fetch_rc=0
          bash .github/scripts/fetch_data_branch.sh || fetch_rc=$?
          if [ "$fetch_rc" = 1 ]; then
            echo "::error::could not fetch origin/data -- refusing to lock against an empty history."
            exit 1
          fi
          if [ "$fetch_rc" = 0 ] && git rev-parse --verify origin/data >/dev/null 2>&1; then
            rm -rf /tmp/nfl-por-restore && mkdir -p /tmp/nfl-por-restore
            git archive origin/data public/data 2>/dev/null | tar -x -C /tmp/nfl-por-restore || true
            mkdir -p public/data/current
            cp /tmp/nfl-por-restore/public/data/current/nfl_por_log_*.jsonl public/data/current/ 2>/dev/null || true
            echo "Restored $(ls public/data/current/nfl_por_log_*.jsonl 2>/dev/null | wc -l) nfl_por_log file(s)."
            # Every earlier run's pregame log has to be on disk for the
            # per-game "last run before kickoff" pick. Never overwrite the
            # one this run just wrote.
            for f in /tmp/nfl-por-restore/public/data/current/nfl_prediction_log_*.jsonl; do
              [ -e "$f" ] || continue
              [ -e "public/data/current/$(basename "$f")" ] || cp "$f" public/data/current/
            done
            echo "NFL prediction logs on disk for the lock: $(ls public/data/current/nfl_prediction_log_*.jsonl 2>/dev/null | wc -l)."
          fi

      - name: Verify the NFL por_logs restored cleanly (if any exist on the data branch)
        run: |
          if ! git rev-parse --verify origin/data >/dev/null 2>&1; then
            if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
              echo "::error::origin/data exists but is not fetched -- cannot verify the por_logs; refusing to continue."
              exit 1
            fi
            echo "origin/data does not exist -- nothing to verify (first-ever run shape)."
            exit 0
          fi
          missing=0
          for f in $(git ls-tree --name-only origin/data public/data/current/ | grep 'nfl_por_log_.*\.jsonl$' || true); do
            if [ ! -f "$f" ]; then
              echo "::error::data branch has $(basename "$f") but it did not land in public/data/current/ -- refusing to continue, which would let nfl_pick_lock.py publish a por_log holding only this run's locks over the real one."
              missing=1
            else
              echo "$(basename "$f") restored ($(grep -c . "$f") lock line(s))."
            fi
          done
          [ "$missing" = 0 ] || exit 1

      # LOCK. B10(b)/(e) plumbing, 2026-09-15 — TUDDY's sibling of
      # bots/pick_lock.py (see that script's own module docstring for the
      # full design). Freezes each market's 5-rung ladder the instant its
      # occupant's own game kicks off (nfl_picks.py's own header names the
      # bug this closes: "the last one wins" on a week-wide recompute), and
      # separately locks prediction_of_record per game_id to the last
      # PREGAME nfl_prediction_log — never a post-kickoff rebuild. A no-op,
      # safely, in preseason: the script reads mode straight off nfl_week.json
      # and exits cleanly when it isn't "week".
      #
      # Runs after the card exists (Build slate) and after odds/report-card
      # steps that don't touch nfl_picks.json, and BEFORE grading reads it —
      # so grading always grades the locked ladder, not a later recompute.
      # continue-on-error for the same reason as the other data steps: a bug
      # in the lock must never cost the whole slate publish.
      - name: Lock the card
        id: lock
        continue-on-error: true
        working-directory: bots/nfl
        run: |
          set -euo pipefail
          ARGS="--season 2026"
          if [ -n "${{ github.event.inputs.week }}" ]; then
            ARGS="$ARGS --week ${{ github.event.inputs.week }}"
          fi
          python nfl_pick_lock.py $ARGS --apply \
            --dir "$GITHUB_WORKSPACE/public/data/current" --prefix nfl_

      # GRADE. Separate step, and it runs on every firing rather than only on
      # the post-game crons: a Sunday-night run should grade the 1pm wave even
      # though the night game is still going, and grading is idempotent — it
      # rewrites the same file from whatever is final so far.
      #
      # It reads the card THE LOCK STEP just wrote (the locked ladder when a
      # game has started, the live recompute otherwise), so the picks being
      # graded are always the picks that were published, never a bare
      # re-derivation that a late-week rebuild could silently change out from
      # under an already-decided rung.
      # A FAILED LOCK SKIPS GRADING (bot audit 10-03): with no lock, the card on
      # disk is the live recompute, and grading it could grade a post-kickoff
      # swap. Grading is idempotent, so the next run with a good lock grades.
      - name: Say the lock failed
        if: steps.lock.outcome == 'failure'
        run: echo "::error::the card lock failed -- grading skipped this run so the live (possibly post-kickoff) card is never graded"
      - name: Grade the card
        if: steps.lock.outcome != 'failure'
        continue-on-error: true
        working-directory: bots/nfl
        run: |
          set -euo pipefail
          ARGS="--mode ${{ steps.mode.outputs.mode }} --season 2026"
          if [ -n "${{ github.event.inputs.week }}" ]; then
            ARGS="$ARGS --week ${{ github.event.inputs.week }}"
          fi
          python nfl_results.py $ARGS \
            --card "$GITHUB_WORKSPACE/public/data/current/nfl_picks.json" \
            --out "$GITHUB_WORKSPACE/public/data/current" --prefix nfl_

      # SIGNAL AUDIT (2026-09-23). Grades every TUDDY flag against real
      # touchdowns, each player frozen at the last archived run before HIS
      # game kicked off -- see nfl_signal_audit.py's docstring. Reads only
      # what is already on the data branch (prediction/signal logs, graded
      # weeks), so it runs after grading and never touches this run's slate.
      # continue-on-error: an audit page must never cost a slate publish.
      - name: Signal audit
        continue-on-error: true
        working-directory: bots/nfl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python nfl_signal_audit.py --season 2026 \
            --out "$GITHUB_WORKSPACE/public/data/current"

      # A failed build must not publish an empty slate over a good one. The
      # site's fetch validates `players.length > 0` before accepting a payload,
      # but the cheaper place to stop it is here, before it ever ships.
      - name: Verify payload
        run: |
          set -euo pipefail
          python - <<'EOF'
          import json, sys, pathlib
          p = pathlib.Path("public/data/current/nfl_week.json")
          if not p.exists():
              sys.exit("nfl_week.json was never written")
          d = json.loads(p.read_text())
          n, g = len(d.get("players", [])), len(d.get("games", []))
          print(f"{n} players, {g} games, mode={d.get('mode')}")
          if n == 0:
              sys.exit("refusing to publish: zero players")
          EOF

      - name: Publish to data branch
        run: bash .github/scripts/publish_data.sh "NFL slate"
