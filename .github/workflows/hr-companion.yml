name: HR Companion Cache Bot
# Phoenix is UTC-7 year-round (no DST).
# Runs at: 12:45am Phoenix time — after spray cache.
on:
  schedule:
    - cron: '45 7 * * *'   # 12:45am PHX
    - cron: '45 9 * * *'   # backup 2h later — runner-acquisition insurance
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hr-companion-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r bots/requirements.txt

      # This job reads a slate file out of bots/outputs/, which is empty in a
      # fresh CI checkout now that bots/outputs is gitignored. Pull the
      # published slate off the data branch first, same as the grader does.
      - name: Fetch published slate
        run: python bots/fetch_picks_for_grading.py --date today

      - name: Restore companion cache
        uses: actions/cache@v4
        with:
          path: bots/outputs/hr_companion_cache.json
          key: hr-companion-${{ github.run_id }}
          restore-keys: |
            hr-companion-

      # FIXED: the old `ls bots/outputs/*today*.json` glob never matched --
      # hr_companion_cache.py's own search globs for "*-today.json" and
      # "slate_*.json", neither of which the fetch step produces. Point it at
      # the stable slate path explicitly instead of guessing at filenames.
      - name: Run HR companion cache
        run: |
          if [ ! -s public/data/today_slate.json ]; then
            echo "No published slate yet — skipping."
            exit 0
          fi
          python bots/hr_companion_cache.py --slate public/data/today_slate.json

      # STREAMLIT MIGRATION (2026-07-25): replaces the old commit+push to
      # main, which added the whole of public/data and bots/outputs to the
      # repo every night.
      - name: Save companion cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: bots/outputs/hr_companion_cache.json
          key: hr-companion-${{ github.run_id }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hr-companion-logs-${{ github.run_id }}
          path: bots/outputs/
          if-no-files-found: ignore
          retention-days: 7
