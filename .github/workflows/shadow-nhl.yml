name: Shadow log - NHL lanes

# Own schedule, own job: NHL goal/points/assists/shots probabilities saved before puck drop (22:45 UTC) and graded the next morning (11:30 UTC).
# Written once, never rewritten. Lives on bbe-history. Changes nothing a pick or a score reads.
on:
  schedule:
    - cron: '45 22 * * *'
    - cron: '30 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shadow-nhl
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy requests
      - name: Cache the NHL game logs
        uses: actions/cache@v4
        with:
          path: ~/.cache/dash_nhl
          key: dash-nhl-${{ github.run_id }}
          restore-keys: dash-nhl-
      - name: Checkout the bbe-history branch (read/write)
        run: |
          git config --global user.name  "moonshot-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git clone --quiet --depth 1 --filter=blob:none --sparse --branch bbe-history \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" _data
          # only the folder this job writes is downloaded (known-issues #107): the branch is ~1.5 GB and most of it is bbe_history/
          git -C _data sparse-checkout set public/data/current/shadow_log
          mkdir -p _data/public/data/current/shadow_log
      - name: Snapshot (evening) / grade yesterday (morning)
        continue-on-error: true
        run: |
          D=_data/public/data/current/shadow_log
          H=$(date -u +%H)
          ET=$(python3 -c "from datetime import datetime,timedelta,timezone;print((datetime.now(timezone.utc)-timedelta(hours=5)).date())")
          Y=$(python3 -c "from datetime import datetime,timedelta,timezone;print((datetime.now(timezone.utc)-timedelta(hours=5,days=1)).date())")
          if [ "$H" -ge 20 ]; then
            python3 bots/shadow_log.py snapshot nhl "$ET" $D
            python3 bots/team_live.py snapshot nhl "$ET" $D
            python3 bots/game_sim.py snapshot nhl "$ET" $D
          else
            [ -e $D/shadow_nhl_$Y.json ] && python3 bots/shadow_log.py grade nhl "$Y" $D
            python3 bots/team_live.py grade-all $D
          fi
          python3 bots/shadow_log.py report $D; python3 bots/team_live.py report $D; python3 bots/game_sim.py report $D
      - name: Commit
        working-directory: _data
        run: |
          git add public/data/current/shadow_log
          if git diff --cached --quiet; then echo "nothing changed"; else
            git commit -m "shadow log nhl $(date -u +%FT%H%MZ)"
            for i in 1 2 3 4 5; do git pull --rebase origin bbe-history && git push origin HEAD:bbe-history && break; echo "push race, retry $i"; sleep $((i * 5)); done
          fi
