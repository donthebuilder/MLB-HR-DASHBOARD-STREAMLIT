name: Pair History Bot
# Phoenix is UTC-7 year-round (no DST).
# Runs at: 12:15am Phoenix time.
on:
  schedule:
    - cron: '15 7 * * *'   # 12:15am PHX
    - cron: '15 9 * * *'   # backup 2h later — runner-acquisition insurance
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pair-history-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r bots/requirements.txt

      # STREAMLIT MIGRATION (2026-07-25): this job used to commit public/data
      # and bots/outputs to main after every run. It now carries its cache
      # between runs with actions/cache instead -- same incremental behavior,
      # no repo growth, nothing pushed to main.
      - name: Restore pair history cache
        uses: actions/cache@v4
        with:
          path: |
            public/data/pair_history_cache.json
            public/data/pair_history_summary.json
            bots/pair_history_cache.json
            bots/pair_history_summary.json
          key: pair-history-${{ github.run_id }}
          restore-keys: |
            pair-history-

      - name: Run pair history cache
        run: |
          export MLB_DASHBOARD_DIR="$GITHUB_WORKSPACE"
          # pair_history_cache.py's copy_to_site() refuses to write unless the
          # target looks like the website repo -- it checks for public/ or
          # app/. Neither exists in a fresh CI checkout: app/ went away with
          # Next.js, and public/data is gitignored so public/ isn't tracked at
          # all. So it printed "Website repo not found", kept the summary in
          # bots/outputs, and the publish step below found nothing to publish.
          # Every nightly run went green and shipped nothing for two weeks.
          mkdir -p public/data
          python bots/pair_history_cache.py
          echo "--- public/data after run ---"
          ls -la public/data

      - name: Save pair history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            public/data/pair_history_cache.json
            public/data/pair_history_summary.json
            bots/pair_history_cache.json
            bots/pair_history_summary.json
          key: pair-history-${{ github.run_id }}

      # The cache above only carries state between runs of THIS job -- the
      # Streamlit app can't read it. The Pairs tab wants pair_history_summary
      # .json, so it has to reach the data branch like everything else the app
      # consumes. Without this the pair-history job ran green every night and
      # its output went nowhere.
      - name: Publish to data branch
        run: bash .github/scripts/publish_data.sh "Pair history"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pair-history-logs-${{ github.run_id }}
          path: |
            outputs/
            bots/outputs/
          if-no-files-found: ignore
          retention-days: 7
