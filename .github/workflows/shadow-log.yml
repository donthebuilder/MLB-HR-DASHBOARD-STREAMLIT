name: Lane shadow log (NHL, NBA)

# Saves every NHL and NBA lane probability BEFORE the games (22:45 UTC, 6:45pm ET) and grades yesterday's next morning
# (11:30 UTC). Rows are written once and never rewritten; this is the forward proof of the backtest numbers and the rows the
# private scoreboard (bots/model_harness.py) can read. Lives on `bbe-history`. Changes nothing a pick or a score reads.
on:
  schedule:
    - cron: '45 22 * * *'
    - cron: '30 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shadow-log
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install numpy requests

      - name: Checkout the bbe-history branch (read/write)
        run: |
          git config --global user.name  "moonshot-bot"
          git config --global user.email "bot@users.noreply.github.com"
          git clone --quiet --depth 1 --branch bbe-history \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" _data
          mkdir -p _data/public/data/current/shadow_log

      - name: Snapshot tonight (evening run) / grade yesterday (morning run)
        continue-on-error: true
        run: |
          D=_data/public/data/current/shadow_log
          H=$(date -u +%H)
          ET=$(python3 -c "from datetime import datetime,timedelta,timezone;print((datetime.now(timezone.utc)-timedelta(hours=5)).date())")
          Y=$(python3 -c "from datetime import datetime,timedelta,timezone;print((datetime.now(timezone.utc)-timedelta(hours=5,days=1)).date())")
          for S in nhl nba; do
            if [ "$H" -ge 20 ]; then
              python3 bots/shadow_log.py snapshot $S "$ET" $D || true
            else
              [ -e $D/shadow_${S}_$Y.json ] && python3 bots/shadow_log.py grade $S "$Y" $D || true
            fi
          done
          python3 bots/shadow_log.py report $D

      - name: Commit
        working-directory: _data
        run: |
          git add public/data/current/shadow_log
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "shadow log $(date -u +%FT%H%MZ)"
            for i in 1 2 3 4 5; do
              git pull --rebase origin bbe-history && git push origin HEAD:bbe-history && break
              echo "push race, retry $i"; sleep $((i * 5))
            done
          fi
