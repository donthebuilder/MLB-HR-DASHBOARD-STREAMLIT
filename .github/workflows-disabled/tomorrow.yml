name: MLB HR Bot — Tomorrow (data branch only)

on:
  schedule:
    # MOVED 2026-08-09, from 07:05/09:05 UTC, to sit AFTER today.yml's OLD
    # 10:30 rollover rather than before it. The bug that fix avoided: at
    # 07:05 UTC the Phoenix date had already ticked over, so this built the
    # slate for the day AFTER the new one -- while today_slim still held the
    # day BEFORE, because today.yml's first run back then wasn't until 12:00.
    # For three and a half hours the site offered a Today of Aug 9 and a
    # Tomorrow of Aug 11, with Aug 10 nowhere on it. The root cause was that
    # GAP between the two workflows, not the two running close together.
    #
    # MOVED AGAIN 2026-08-28: today.yml's rollover itself moved to 07:05 UTC
    # (12:05am Phoenix, by request). Since the old bug was the multi-hour gap
    # between this workflow and the rollover -- not simultaneity -- this now
    # fires at the SAME 07:05 UTC as the rollover instead of an hour after
    # it: closing that gap to (near) zero is strictly safer than the 1-hour
    # version was, not a step back toward the 2026-08-09 bug. The two jobs
    # aren't in the same concurrency group, so they run independently; a
    # normal slate build finishes in a few minutes either way.
    - cron: "5 7 * * *"    # 12:05am Phoenix — same moment as today.yml's rollover
    - cron: "5 9 * * *"    # backup 2h later — runner-acquisition insurance
  workflow_dispatch: {}

# One group PER WORKFLOW, not one shared across all of them.
# GitHub keeps at most a single *pending* run per concurrency group, so a
# shared group meant each newly queued run cancelled the previously queued
# one -- that's what silently killed the Tomorrow slate and the Grade Results
# run. Publishing races are handled in publish_data.sh instead, which
# re-reads the data branch immediately before it force-pushes.
concurrency:
  group: mlb-tomorrow
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-tomorrow-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
      RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r bots/requirements.txt

      - name: Restore SQLite cache
        uses: actions/cache@v4
        with:
          path: bots/mlb_hr_cache.sqlite
          key: sqlite-cache-${{ github.run_id }}
          restore-keys: |
            sqlite-cache-

      - name: Run scoring bot (tomorrow)
        run: python bots/mlb_dashboard.py --tomorrow

      - name: Build slim payload for Streamlit
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python bots/make_slim.py

      # ── DID THE DETAIL ACTUALLY GET BUILT? (2026-08-29) ────────────────
      # The per-player layer -- spray charts, contact logs, pitch profiles,
      # pitcher arsenals and lineup-spot damage -- went stale on the live
      # branch and nothing anywhere went red. Both detail directories held a
      # coherent snapshot of a night that was on NEITHER slate file beside
      # them, and the only visible symptom was a modal saying "no detail file
      # published" for 27 of 30 starters.
      #
      # make_slim.py now stamps each directory it writes. This step asserts
      # the stamp matches the slate this run just built. It is
      # continue-on-error ON PURPOSE: a broken detail layer must be loud, but
      # it must not cost the night its slate -- publish_data.sh drops a
      # mismatched directory on its own, so the board still ships and the
      # site honestly says the detail is missing.
      - name: Verify the tomorrow detail directory matches this run's slate
        continue-on-error: true
        run: |
          MAN="public/data/current/detail/tomorrow/_manifest.json"
          META="public/data/current/tomorrow_run_meta.json"
          if [ ! -f "$MAN" ]; then
            echo "::error::make_slim wrote no detail manifest for the tomorrow slate -- the per-player layer was not rebuilt this run."
            exit 1
          fi
          WANT="$(sed -n 's/.*"slate_date"[[:space:]]*:[[:space:]]*"\([0-9-]\{10\}\)".*/\1/p' "$META" 2>/dev/null | head -n 1)"
          HAVE="$(sed -n 's/.*"slate_date"[[:space:]]*:[[:space:]]*"\([0-9-]\{10\}\)".*/\1/p' "$MAN" | head -n 1)"
          PITCHERS="$(sed -n 's/.*"pitcher_count"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p' "$MAN" | head -n 1)"
          BATTERS="$(sed -n 's/.*"batter_count"[[:space:]]*:[[:space:]]*\([0-9]*\).*/\1/p' "$MAN" | head -n 1)"
          echo "detail/tomorrow: slate=$HAVE (run meta says $WANT), $BATTERS batters, $PITCHERS pitchers"
          if [ -n "$WANT" ] && [ "$WANT" != "$HAVE" ]; then
            echo "::error::detail/tomorrow is stamped $HAVE but this run built $WANT."
            exit 1
          fi
          if [ "${PITCHERS:-0}" -lt 1 ]; then
            echo "::error::detail/tomorrow has no pitcher files -- every arsenal and pitch-mix chart on the site will be blank for this slate."
            exit 1
          fi

      # Day/night, home/away, day-of-week and win/loss splits. The
      # scoring bot only carries vs-RHP/LHP, so these come from MLB's
      # gameLog endpoint -- one request per hitter, ~2 min for a slate.
      - name: Build situational splits
        run: python bots/player_splits.py --slate public/data/current/tomorrow.json --label tomorrow
        continue-on-error: true

      - name: Save SQLite cache
        uses: actions/cache/save@v4
        with:
          path: bots/mlb_hr_cache.sqlite
          key: sqlite-cache-${{ github.run_id }}

      # REWRITTEN: this job used to `git add -A` and push the entire slate
      # output to `main` on every run, with a rebase-retry loop. That is what
      # committed 20+ GB of JSON into the repo's history and broke the
      # Streamlit Cloud clone. It now publishes the same way every other bot
      # job does -- small files, data branch, single orphan commit, never main.
      - name: Publish to data branch
        run: bash .github/scripts/publish_data.sh "Tomorrow slate"
