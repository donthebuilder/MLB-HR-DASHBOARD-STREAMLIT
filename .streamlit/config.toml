# Palette lifted verbatim from the old site's lib/theme.js so the Streamlit
# build matches what the Next.js dashboard looked like.
[theme]
base = "dark"
primaryColor = "#f97316"          # C.orange
backgroundColor = "#09090b"       # C.bg
secondaryBackgroundColor = "#111113"  # C.bg2
textColor = "#f4f4f5"             # C.text
font = "sans serif"

[server]
maxUploadSize = 5

[browser]
gatherUsageStats = false
