# Palette matched to the trading terminal look — near-black chrome, green as
# the magnitude colour, red reserved for genuinely bad.
[theme]
base = "dark"
primaryColor = "#26a65b"
backgroundColor = "#0b0e11"
secondaryBackgroundColor = "#131722"
textColor = "#d1d4dc"
font = "sans serif"

[server]
maxUploadSize = 5

[browser]
gatherUsageStats = false
